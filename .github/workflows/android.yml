name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mamays-proyecto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mamays-proyecto/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web y preparar Android
        run: npm run android:prepare

      - name: Compilar APK
        working-directory: mamays-proyecto/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MAMAYS.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MAMAYS-apk
          path: mamays-proyecto/MAMAYS.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" MAMAYS.apk \
            --title "MAMAYS APK #${{ github.run_number }}" \
            --notes "Descarga MAMAYS.apk en tu Android y ábrelo para instalar." \
            --latest
